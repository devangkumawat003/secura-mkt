<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>Secura Go-to-Market Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Lora:wght@500;600&display=swap">
<style id="page-style">
/* Layout: outcome + audience up top, then a fractal overview (positioning band -> 5 channels -> prospect -> lead),
   then one vertical spine per section, each channel opening with its P1 box. #all-p1s lists every P1 from both plans, unfiltered.
   A DFR | SSP toggle above the outcome bento switches between two plans kept side by side in the state.
   Every P1 line is a card with a stable id; #p1s is the 2-week plan board (plan above the line, DFR and SSP P1s below).
   Inside the plan: milestone sections (type, deadline, P1s and ad hoc tasks) plus a section for P1s not tied to a milestone.
   All text lives in the JSON state block (sanitized HTML: bold, bullet lists, line breaks) and renders from it;
   "Edit text" makes it editable and Save republishes the page. */
:root{
  --bg:#0F2019; --surface:#152A21; --surface-2:#1B3529; --ink:#ECF3E7; --muted:#A4B9AB;
  --line:#2D4B3D; --line-strong:#4C7260;
  --accent:#C9F15C; --accent-fill:#C9F15C; --on-accent:#0F2019; --accent-soft:rgba(201,241,92,.09);
  --shadow:rgba(0,0,0,.35);
  --dfr:#C9F15C; --ssp:#6CD4F2; --on-prog:#0F2019;
  --t-red:#FF8A80; --t-amber:#FFC861; --t-violet:#B9A4FF; --t-pink:#FF9CCB;
  --font-claim:"Lora", Georgia, "Times New Roman", serif;
  --font-body:"Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono:"Geist Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --col:56px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F1F5EE; --surface:#FFFFFF; --surface-2:#E7EFE3; --ink:#14231B; --muted:#55675C;
    --line:#C8D5CA; --line-strong:#8EA596;
    --accent:#3B7313; --accent-fill:#C9F15C; --on-accent:#14231B; --accent-soft:rgba(59,115,19,.07);
    --shadow:rgba(20,35,27,.12);
    --dfr:#3B7313; --ssp:#0B6E8A; --on-prog:#FFFFFF;
    --t-red:#C0392B; --t-amber:#A86800; --t-violet:#6A4FD1; --t-pink:#B0306E;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F1F5EE; --surface:#FFFFFF; --surface-2:#E7EFE3; --ink:#14231B; --muted:#55675C;
  --line:#C8D5CA; --line-strong:#8EA596;
  --accent:#3B7313; --accent-fill:#C9F15C; --on-accent:#14231B; --accent-soft:rgba(59,115,19,.07);
  --shadow:rgba(20,35,27,.12);
  --dfr:#3B7313; --ssp:#0B6E8A; --on-prog:#FFFFFF;
  --t-red:#C0392B; --t-amber:#A86800; --t-violet:#6A4FD1; --t-pink:#B0306E;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.k{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}

/* Rich text (bold + bullet points) */
[data-path] b{font-weight:600;color:var(--ink)}
.rich ul{margin:6px 0 2px;padding-left:20px;list-style:disc;display:grid;gap:3px}
.rich li{padding-left:2px}
.rich li::marker{color:var(--accent)}

/* ---------- Hero ---------- */
.hero{padding-block:56px 8px}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--font-claim);font-weight:600;font-size:clamp(32px,5vw,54px);line-height:1.08;letter-spacing:-.01em;max-width:18ch;margin:14px 0 18px;text-wrap:balance}
.lede{max-width:64ch;color:var(--muted);font-size:17px;margin:0}

.progrow{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-top:30px}
.progk{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prog{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);flex:none}
.prog-btn{font:600 13px var(--font-mono);letter-spacing:.08em;color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 20px;cursor:pointer;transition:background .15s,color .15s}
.prog-btn:hover{color:var(--ink)}
.prog-btn[aria-pressed="true"]{background:var(--accent-fill);color:var(--on-accent)}
.prog-sm .prog-btn{font-size:11.5px;padding:4px 11px}
.facts{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;margin-top:30px}
.progrow + .facts{margin-top:16px}
.fact{border:1px solid var(--line);border-radius:18px;padding:22px;background:var(--surface);min-width:0}
.fact.outcome{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface)}
.fact h2{font-family:var(--font-claim);font-weight:600;font-size:28px;line-height:1.15;margin:4px 0 10px}
.fact p,.fact .ftext{margin:0;color:var(--muted)}
.fact p strong{color:var(--ink);font-weight:500}
.agroup{margin-top:14px}
.agroup .k{color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pill{font-size:13px;line-height:1.3;padding:5px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--ink);background:var(--surface-2)}
.pill.soft{border-style:dashed;background:transparent;color:var(--muted)}
@media (max-width:759px){.facts{grid-template-columns:1fr}}

.legend{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:26px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.sw{display:inline-block;width:22px;height:14px;border-radius:4px;border:1px solid var(--line-strong)}
.sw.sw-hub{background:var(--surface-2)}
.sw.p1{border:1.5px solid var(--accent);background:var(--accent-soft)}
.sw.sw-node{background:var(--surface);border-color:var(--line)}
.sw.idea{border-style:dashed;background:transparent}
.sw.arrow{width:0;height:0;border:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--accent);border-radius:0}
.sw.xl{width:auto;height:auto;padding:1px 7px;border-style:dashed;border-radius:999px;font-family:var(--font-mono);font-size:11px;color:var(--ink)}

/* ---------- Overview map ---------- */
.map{margin-top:30px;padding:28px;border:1px solid var(--line);border-radius:20px;
  background:radial-gradient(120% 90% at 0% 0%,var(--accent-soft),transparent 60%),var(--surface)}
.map-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.map-head h2{font-family:var(--font-claim);font-weight:600;font-size:22px;margin:0}
.map-head p{margin:0;color:var(--muted);font-size:13.5px}
.pband{display:flex;align-items:center;justify-content:center;gap:6px 16px;flex-wrap:wrap;padding:14px 18px;border:1.5px solid var(--accent);border-radius:14px;background:var(--surface-2);text-decoration:none;text-align:center;transition:background .15s}
.pband:hover{background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface-2)}
.pband b{font-weight:600;font-size:16px}
.pband small{color:var(--muted);font-size:13px;max-width:60ch}
.mnode{width:fit-content;max-width:100%;margin:0 auto;padding:10px 18px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface-2);text-align:center}
.mnode b{display:block;font-weight:600}
.mnode small{display:block;color:var(--muted);font-size:13px}
.mnode.end{border-color:var(--accent);background:var(--accent-soft)}
.vline{width:2px;height:24px;margin:0 auto;background:var(--line-strong)}
.map-grid{position:relative;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:10px;padding-block:24px}
.map-grid::before,.map-grid::after{content:"";position:absolute;height:2px;background:var(--line-strong);left:calc((100% - (var(--n,5) - 1) * 10px) / (2 * var(--n,5)));right:calc((100% - (var(--n,5) - 1) * 10px) / (2 * var(--n,5)))}
.map-grid::before{top:0}.map-grid::after{bottom:0}
.mtile{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-decoration:none;min-width:0;transition:border-color .15s}
.mtile::before,.mtile::after{content:"";position:absolute;left:calc(50% - 1px);width:2px;height:25px;background:var(--line-strong)}
.mtile::before{top:-25px}.mtile::after{bottom:-25px}
.mtile:hover{border-color:var(--accent)}
.mt-n{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;color:var(--accent)}
.mt-name{font-weight:600;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.mt-k{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:4px}
@media (max-width:759px){
  .pband{justify-content:flex-start;text-align:left}
  .mnode{margin-left:0;text-align:left}
  .vline{margin-left:11px}
  .map-grid{grid-template-columns:1fr;gap:8px;padding:0 0 0 32px}
  .map-grid::before{left:11px;right:auto;top:0;bottom:0;width:2px;height:auto}
  .map-grid::after{display:none}
  .mtile::before{left:-21px;top:calc(50% - 1px);width:21px;height:2px}
  .mtile::after{display:none}
}
@media (max-width:520px){.map{padding:20px 16px}}

/* ---------- Sticky nav ---------- */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-top:40px;
  background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:8px;padding-block:10px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-family:var(--font-mono);font-size:12px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;text-decoration:none;transition:background .15s,color .15s}
.chip:hover{color:var(--ink);border-color:var(--line-strong)}
.chip.on{background:var(--accent-fill);color:var(--on-accent);border-color:transparent}
.tbtn{flex:none;display:inline-block;font:500 12.5px var(--font-body);line-height:1.4;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap;text-decoration:none}
.tbtn[aria-pressed="true"],.tbtn[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tbtn.primary{background:var(--accent-fill);color:var(--on-accent);border-color:transparent;font-weight:600}
.tbtn:disabled{opacity:.6;cursor:default}
.progress{height:2px;background:var(--accent);transform-origin:left center;transform:scaleX(0)}
@media (max-width:560px){.nav-inner{flex-wrap:wrap}.chips{flex-basis:100%;order:-1}}

/* ---------- Sections ---------- */
.ch{padding-block:64px 8px;scroll-margin-top:60px}
.flow{position:relative;display:grid;grid-template-columns:minmax(0,1fr) var(--col) minmax(0,1fr);row-gap:16px;align-items:start}
.flow::before{content:"";position:absolute;left:calc(50% - 1px);top:24px;bottom:8px;width:2px;background:var(--line-strong)}
.flow::after{content:"";position:absolute;left:calc(50% - 5px);bottom:0;width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.ch.is-flow .flow::before{background:repeating-linear-gradient(to bottom,var(--accent) 0 7px,transparent 7px 18px);opacity:.6;animation:signal 1.4s linear infinite}
@keyframes signal{to{background-position:0 18px}}
@media (prefers-reduced-motion: reduce){.ch.is-flow .flow::before{animation:none}}

.hub{grid-column:1/-1;justify-self:center;width:min(100%,720px);position:relative;z-index:1;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:20px;padding:22px 24px;margin-bottom:16px}
.ch.pos .hub{border:1.5px solid var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface-2)}
.hub-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.code{font-family:var(--font-mono);font-size:12px;font-weight:500;letter-spacing:.06em;background:var(--accent-fill);color:var(--on-accent);padding:3px 9px;border-radius:6px}
.mode{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hub h2{font-family:var(--font-claim);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.14;margin:14px 0 10px;text-wrap:balance}
.obj{margin:0;color:var(--muted);font-size:16px;max-width:64ch}
.obj + .obj{margin-top:14px}

/* P1 box: top of positioning and every channel */
.p1box{grid-column:1/-1;justify-self:center;width:min(100%,720px);position:relative;z-index:1;border:1.5px solid var(--accent);border-radius:16px;background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface);padding:14px 20px 18px;margin-bottom:8px;overflow-wrap:anywhere}
.p1lbl{display:flex;align-items:center;gap:10px;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.p1text{min-height:24px;color:var(--ink);font-size:15.5px}
.p1text:empty::before{content:"No P1s added yet.";color:var(--muted);font-style:italic}

.node{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0;overflow-wrap:anywhere}
.node.l{grid-column:1}.node.r{grid-column:3}
.node::before{content:"";position:absolute;top:24px;height:2px;width:calc(var(--col)/2 + 1px);background:var(--line-strong)}
.node.l::before{right:calc(-1 * (var(--col)/2 + 1px))}
.node.r::before{left:calc(-1 * (var(--col)/2 + 1px))}
.node::after{content:"";position:absolute;top:19px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line-strong)}
.node.l::after{right:calc(-1 * (var(--col)/2 + 7px))}
.node.r::after{left:calc(-1 * (var(--col)/2 + 7px))}
.node.idea{border-style:dashed;background:var(--bg)}
.node.small{padding-block:13px}
.node h3,.step h3{font-weight:600;font-size:16.5px;line-height:1.3;margin:0;text-wrap:balance}
.node h3 + *,.step h3 + *{margin-top:6px}
.tag{display:inline-block;margin-left:8px;font-family:var(--font-mono);font-size:10.5px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;border:1px dashed var(--line-strong);padding:1px 6px;border-radius:4px;color:var(--muted);vertical-align:2px}
.desc{margin:0;color:var(--muted);max-width:64ch}
.items{list-style:none;margin:12px 0 0;padding:0 0 0 16px;border-left:1px solid var(--line);display:grid;gap:10px}
.items > li{position:relative}
.items > li::before{content:"";position:absolute;left:-16px;top:11px;width:10px;height:1px;background:var(--line-strong)}
.items .t{display:block;font-weight:500}
.items .d{display:block;color:var(--muted);font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.items .links{margin-top:6px}
.step .pills{margin-top:12px}
.xl{font-family:var(--font-mono);font-size:11.5px;color:var(--ink);border:1px dashed var(--line-strong);padding:3px 9px;border-radius:999px;text-decoration:none;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s,color .15s}
.xl:hover{border-color:var(--accent);color:var(--accent)}

.step{grid-column:1/-1;justify-self:center;width:min(100%,600px);position:relative;z-index:1;background:var(--surface);border:1.5px solid var(--line-strong);border-radius:14px;padding:16px 18px;margin-top:12px;overflow-wrap:anywhere}
.step.arrow::before{content:"";position:absolute;top:-13px;left:calc(50% - 7px);border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--accent)}
.step.base{background:var(--surface-2)}
.step.start{border-color:var(--accent);background:linear-gradient(var(--accent-soft),var(--accent-soft)),var(--surface)}
.stage{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.blabel{grid-column:1/-1;justify-self:center;position:relative;z-index:1;font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:4px 11px;border:1px solid var(--line);border-radius:999px;margin-top:10px}

@media (max-width:759px){
  :root{--col:26px}
  .flow::before{left:12px}
  .flow::after{left:8px}
  .node.l,.node.r{grid-column:2}
  .node.l::before{right:auto;left:calc(-1 * (var(--col)/2 + 1px))}
  .node.l::after{right:auto;left:calc(-1 * (var(--col)/2 + 7px))}
  .step,.blabel,.p1box{grid-column:2;justify-self:stretch;width:auto}
  .blabel{justify-self:start}
  .step::after,.p1box::after{content:"";position:absolute;top:24px;left:calc(-1 * (var(--col)/2 + 1.5px));width:calc(var(--col)/2 + 1.5px);height:2px;background:var(--line-strong)}
  .step.arrow::before{top:19px;left:-10px;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:8px solid var(--accent);border-right:0}
  .hub{padding:20px 18px}
}

/* Titles-only view */
.compact .desc,.compact .items .d,.compact .obj + .obj{display:none}
.compact .items{gap:6px}

/* ---------- Cross-links ---------- */
.xsec{padding-block:80px 32px}
.xsec h2{font-family:var(--font-claim);font-weight:600;font-size:clamp(26px,3.4vw,36px);line-height:1.15;margin:0 0 8px;text-wrap:balance}
.xsec .xintro{color:var(--muted);margin:0 0 24px;max-width:64ch}
.xrows{display:grid;gap:10px}
.xrow{display:grid;grid-template-columns:auto auto auto minmax(0,1fr);align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.xrow .from{display:flex;flex-wrap:wrap;gap:6px}
.xrow .arr{color:var(--accent);font-family:var(--font-mono)}
.xrow .xt{margin:0;color:var(--muted);min-width:0}
@media (max-width:640px){.xrow{display:flex;flex-wrap:wrap;gap:8px 10px}.xrow .xt{flex-basis:100%}}
.foot-note{padding-block:24px 56px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}

/* ---------- All P1s view ---------- */
.p1hero{padding-block:48px 4px}
.p1hero h1{margin-bottom:12px}
.p1back{margin:14px 0 0;font-size:14px}
.p1hero .progrow{margin-top:20px}
.p1back a{color:var(--accent);text-underline-offset:3px}
.p1list{max-width:820px;display:grid;gap:14px;padding-block:28px 72px}
.p1card{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:18px 20px;min-width:0;overflow-wrap:anywhere}
.p1card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.p1card-name{font-family:var(--font-claim);font-weight:600;font-size:21px;line-height:1.2;text-decoration:none}
.p1card-name:hover{text-decoration:underline;text-underline-offset:3px}

/* ---------- Editing ---------- */
.editing [data-path]{outline:1px dashed var(--line-strong);outline-offset:2px;border-radius:3px;cursor:text;transition:outline-color .15s}
.editing [data-path]:hover{outline-color:var(--accent)}
.editing [data-path]:focus{outline:2px solid var(--accent);outline-offset:2px}
.editing [data-path]:empty::before{content:"Empty";color:var(--muted);font-style:italic}
.editing .p1text{min-height:56px}
.editing .p1text:empty::before{content:"Click to add P1s. Use List for bullet points and B for bold.";color:var(--muted);font-style:italic}

  function setP(path, v){ var ks = path.split('.'), o = base(path); for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length-1]] = v; }
  function isRich(path){ var k = path.slice(path.lastIndexOf('.') + 1); return !!(RICH_KEYS[k] || RICH_PATHS[path] || /^xl\.\d+\.text$/.test(path)); }
  function ensurePlan(){
    if (!S.plan || typeof S.plan !== 'object') S.plan = {};

    if (!Array.isArray(p.items)) p.items = [];
    if (!p.tags || typeof p.tags !== 'object') p.tags = {};
    if (!Array.isArray(p.colors)) p.colors = TAG_KEYS.map(function(k){ return { key: k, label: '' }; });
    if (p.range == null) p.range = '';
    if (p.goal == null) p.goal = '';
    if (!Array.isArray(p.milestones)) p.milestones = [];
    p.milestones.forEach(function(m){ if (!Array.isArray(m.items)) m.items = []; });

  function progHtml(size){
    return '<div class="prog prog-' + size + '" role="group" aria-label="Plan">' + S.order.map(function(k){

  function progRow(){ return '<div class="progrow"><span class="progk">Marketing plan for</span>' + progHtml('lg') + '</div>'; }

  /* Stored text is a small HTML subset: <b>, <br> everywhere; <ul><li> only in rich fields. Everything else is unwrapped. */
  function isBoldEl(n){ var w = n.style ? n.style.fontWeight : ''; return w === 'bold' || w === 'bolder' || parseInt(w, 10) >= 600; }
  function tidy(s){
    return s.replace(/<br>\s*(?=<\/?ul>)/g, '').replace(/(<\/ul>)\s*<br>/g, '$1').replace(/(?:<br>\s*){3,}/g, '<br><br>')
            .replace(/ {2,}/g, ' ').replace(/^(?:\s|<br>)+|(?:\s|<br>)+$/g, '');
  }
  function walk(node, br, list){
    var s = '';
    for (var i = 0; i < node.childNodes.length; i++){
      var n = node.childNodes[i];
      if (n.nodeType === 3){ s += esc(n.nodeValue.replace(/[\s ]+/g, ' ')); continue; }
      if (n.nodeType !== 1) continue;
      var tag = n.tagName.toLowerCase();
      if (tag === 'script' || tag === 'style' || tag === 'template') continue;
      if (tag === 'br'){ s += br ? '<br>' : ' '; continue; }
      if (tag === 'b' || tag === 'strong' || isBoldEl(n)){
        var bi = walk(n, br, false);
        s += /\S/.test(bi.replace(/<br>/g, '')) ? '<b>' + bi + '</b>' : bi;
        continue;
      }
      if (tag === 'ul' || tag === 'ol'){
        if (list){
          var lis = '';
          for (var j = 0; j < n.childNodes.length; j++){
            var c = n.childNodes[j], li;
            if (c.nodeType === 1) li = c.tagName.toLowerCase() === 'li' ? walk(c, true, false) : walk({ childNodes: [c] }, true, false);
            else if (c.nodeType === 3) li = esc(c.nodeValue.replace(/[\s ]+/g, ' '));
            else continue;
            li = tidy(li);
            if (li) lis += '<li>' + li + '</li>';
          }
          if (lis) s += '<ul>' + lis + '</ul>';
        } else {
          s += walk(n, br, false);
        }
        continue;
      }
      if (tag === 'li'){ s += walk(n, br, false) + (br ? '<br>' : ' '); continue; }
      if (tag === 'div' || tag === 'p'){
        var inner = walk(n, br, list);
        if (br){ if (s && !/(<br>|<\/ul>)\s*$/.test(s) && inner.indexOf('<ul>') !== 0) s += '<br>'; s += inner; }
        else s += ' ' + inner + ' ';
        continue;
      }
      s += walk(n, br, list);
    }
    return s;
  }
  function clean(v, rich){
    if (v == null || v === '') return '';
    var t = document.createElement('template');
    t.innerHTML = String(v);
    return tidy(walk(t.content, rich, rich));

  function T(tag, path, cls, extra){
    var rich = isRich(path), c = (cls || '') + (rich ? (cls ? ' ' : '') + 'rich' : '');

  var MS_TYPES = { hosted: 'Hosted by Secura', external: 'External event', other: 'Other' };
  function planLists(){ return [{ mid: '', items: S.plan.items }].concat(S.plan.milestones.map(function(m){ return { mid: m.id, items: m.items }; })); }
  function inPlan(id){ return planLists().some(function(l){ return l.items.indexOf(id) > -1; }); }
  function listOf(id){ var ls = planLists(); for (var i = 0; i < ls.length; i++) if (ls[i].items.indexOf(id) > -1) return ls[i].mid; return ''; }
  function removeFromPlan(id){
    S.plan.items = S.plan.items.filter(function(x){ return x !== id; });

  }

  function isTask(id){ return !!S.plan.tasks[id]; }
  function plain(v){ return clean(v, false).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').trim(); }
  function sortedMs(){
    return S.plan.milestones.map(function(m, i){ return { m: m, i: i }; }).sort(function(a, b){
      var da = a.m.deadline || '9999', db = b.m.deadline || '9999';

  function dueInfo(v){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(v || '');
    if (!m) return { date: 'No deadline yet', rel: '', cls: 'none' };
    var d = new Date(+m[1], +m[2] - 1, +m[3]), t = new Date(); t.setHours(0, 0, 0, 0);
    var n = Math.round((d - t) / 86400000);
    var rel = n === 0 ? 'Due today' : n === 1 ? 'Due tomorrow' : n > 1 ? 'In ' + n + ' days' : (n === -1 ? '1 day overdue' : (-n) + ' days overdue');
    var fmt = { day: 'numeric', month: 'short' };
    if (d.getFullYear() !== t.getFullYear()) fmt.year = 'numeric';
    return { date: d.toLocaleDateString('en-GB', fmt), rel: rel, cls: n < 0 ? 'late' : n <= 3 ? 'soon' : '' };

  function bar(mode, msg){ BAR = mode ? { mode: mode, msg: msg } : null; applyBar(); }

  function observe(){

    io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){ if (e.isIntersecting) setActive(e.target.id); });
    }, { rootMargin: '-35% 0px -60% 0px' });
    P().sections.forEach(function(c){ var el = document.getElementById(c.id); if (el) io.observe(el); });

    }

  /* ---------- 2-week plan: move, color, add and delete P1s ---------- */
  function movePlan(id, mid, at){
    var idx = itemIndex();
    removeFromPlan(id);
    var m = mid ? msById(mid) : null;
    var list = (m ? m.items : S.plan.items).filter(function(x){ return idx[x] || isTask(x); });
    if (at == null || at > list.length) at = list.length;
    list.splice(at, 0, id);
    if (m) m.items = list; else S.plan.items = list;
    touch();
  }
  function unplan(id){
    if (isTask(id) || !inPlan(id)) return;
    removeFromPlan(id);
    touch();
  }
  function startEditing(){
    if (EDITING) return;
    EDITING = true;
    try { document.execCommand('styleWithCSS', false, false); } catch(e){}
  }
  function focusPath(path){
    var el = root.querySelector('[data-path="' + path + '"]'); if (!el) return;
    el.focus();
    try { var r = document.createRange(); r.selectNodeContents(el); r.collapse(false); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); } catch(e){}
  }
  function addTask(mid, afterId){
    var id = 't' + newId().slice(1);
    S.plan.tasks[id] = { text: '' };
    var m = mid ? msById(mid) : null, list = m ? m.items : S.plan.items;
    var at = afterId ? list.indexOf(afterId) + 1 : list.length;
    list.splice(at > 0 ? at : list.length, 0, id);
    startEditing(); DIRTY = true;
    remount();
    bar('edit', 'You have unsaved changes to the 2-week plan.');
    focusPath('plan.tasks.' + id + '.text');
  }
  function delTask(id){ removeFromPlan(id); delete S.plan.tasks[id]; delete S.plan.tags[id]; delete S.plan.done[id]; touch(); }
  function addMilestone(){
    S.plan.milestones.push({ id: 'm' + newId().slice(1), name: '', type: 'hosted', deadline: '', items: [] });
    startEditing(); DIRTY = true;
    remount();
    bar('edit', 'Name the milestone and set its deadline, then save.');
    focusPath('plan.milestones.' + (S.plan.milestones.length - 1) + '.name');
  }
  function delMilestone(mid){
    var m = msById(mid); if (!m) return;
    S.plan.items = S.plan.items.concat(m.items);
    S.plan.milestones = S.plan.milestones.filter(function(x){ return x.id !== mid; });
    touch('Milestone deleted. Its P1s and tasks moved to Other P1s.');
  }
  function setMs(mid, key, val){ var m = msById(mid); if (!m || m[key] === val) return; m[key] = val; touch(); }
  function toggleDone(id){ if (S.plan.done[id]) delete S.plan.done[id]; else S.plan.done[id] = true; touch(); }
  function addItem(k, si, after){
    var sc = S.programs[k] && S.programs[k].sections[si]; if (!sc) return;
    if (!sc.p1items) sc.p1items = [];
    var j = after == null ? sc.p1items.length : after + 1;
    sc.p1items.splice(j, 0, { id: newId(), text: '' });
    DIRTY = true;
    remount();
    bar('edit', 'You have unsaved changes.');
    var el = root.querySelector('[data-path="' + itemPath(k, si, j) + '"]');
    if (el) el.focus();
  }
  function delItem(k, si, j){
    var sc = S.programs[k] && S.programs[k].sections[si]; if (!sc || !sc.p1items || !sc.p1items[j]) return;
    var id = sc.p1items[j].id;
    sc.p1items.splice(j, 1);
    removeFromPlan(id);
    delete S.plan.tags[id]; delete S.plan.done[id];
    touch('You have unsaved changes.');
  }
  function pruneItems(){
    var keep = {};
    S.order.forEach(function(k){
      S.programs[k].sections.forEach(function(sc){
        if (!sc.p1items) return;
        sc.p1items = sc.p1items.filter(function(it){
          var ok = clean(it.text, false).replace(/<[^>]+>/g, '').trim() !== '';
          if (ok) keep[it.id] = 1;
          return ok;
        });
      });
    });
    var listed = {};
    planLists().forEach(function(l){ l.items.forEach(function(id){ listed[id] = 1; }); });
    Object.keys(S.plan.tasks).forEach(function(id){
      if (listed[id] && plain(S.plan.tasks[id].text)) keep[id] = 1; else delete S.plan.tasks[id];
    });
    var k = function(id){ return keep[id]; };
    S.plan.items = S.plan.items.filter(k);
    S.plan.milestones.forEach(function(m){ m.items = m.items.filter(k); });
    Object.keys(S.plan.tags).forEach(function(id){ if (!keep[id]) delete S.plan.tags[id]; });
    Object.keys(S.plan.done).forEach(function(id){ if (!keep[id]) delete S.plan.done[id]; });
  }
  function openColor(btn, key){
    closePop();
    var id = btn.getAttribute('data-id'), cur = S.plan.tags[id] || '';
    POP = document.createElement('div');
    POP.className = 'cpop'; POP.setAttribute('data-for', key);
    POP.innerHTML = '<button type="button" class="csw none' + (cur ? '' : ' on') + '" data-act="setcolor" data-id="' + id + '" data-color="" aria-label="No color" title="No color"></button>' +
      S.plan.colors.map(function(c){
        var name = clean(c.label, false).replace(/<[^>]+>/g, '') || c.key;
        return '<button type="button" class="csw' + (cur === c.key ? ' on' : '') + '" data-tag="' + c.key + '" data-act="setcolor" data-id="' + id + '" data-color="' + c.key + '" aria-label="' + esc(name) + '" title="' + esc(name) + '"></button>';
      }).join('');

  }
  /* "+" on a card below the line: choose which part of the plan it goes into. */
  function openDest(btn, key){
    closePop();

    var opts = sortedMs().map(function(o){ return [o.m.id, plain(o.m.name) || 'Untitled milestone', dueInfo(o.m.deadline).date]; });

    }).join('') + '</div>';
    placePop(btn);
  }
  /* In-page calendar for milestone deadlines (native date pickers are unreliable inside the artifact frame). */
  function ymd(d){ return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function calHtml(){
    var first = new Date(CAL.y, CAL.m, 1), lead = (first.getDay() + 6) % 7, days = new Date(CAL.y, CAL.m + 1, 0).getDate();
    var today = ymd(new Date()), ms = msById(CAL.mid), sel = ms ? ms.deadline || '' : '';
    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<span></span>';
    for (var d = 1; d <= days; d++){
      var key = ymd(new Date(CAL.y, CAL.m, d));
      cells += '<button type="button" class="cday' + (key === today ? ' today' : '') + (key === sel ? ' on' : '') + '" data-act="cal-day" data-mid="' + CAL.mid + '" data-date="' + key + '">' + d + '</button>';
    }
    return '<div class="cal"><div class="cal-head">' +
      '<button type="button" class="ibtn sm" data-act="cal-nav" data-step="-1" aria-label="Previous month">‹</button>' +
      '<span class="cal-title">' + first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }) + '</span>' +
      '<button type="button" class="ibtn sm" data-act="cal-nav" data-step="1" aria-label="Next month">›</button></div>' +
      '<div class="cal-dow"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>' +
      '<div class="cal-grid">' + cells + '</div>' +
      '<div class="cal-foot"><button type="button" class="dopt" data-act="cal-day" data-mid="' + CAL.mid + '" data-date="' + today + '">Today</button>' +
      (sel ? '<button type="button" class="dopt" data-act="cal-clear" data-mid="' + CAL.mid + '">Clear deadline</button>' : '') + '</div></div>';
  }
  function openCal(btn, key){
    closePop();
    var mid = btn.getAttribute('data-mid'), m = msById(mid), dl = m && /^(\d{4})-(\d{2})-\d{2}$/.exec(m.deadline || '');
    var base = dl ? new Date(+dl[1], +dl[2] - 1, 1) : new Date();
    CAL = { mid: mid, y: base.getFullYear(), m: base.getMonth() };
    POP = document.createElement('div');
    POP.className = 'cpop calpop'; POP.setAttribute('data-for', key);
    POP.innerHTML = calHtml();
    placePop(btn);
  }
  function placePop(btn){
    document.body.appendChild(POP);
    var r = btn.getBoundingClientRect();
    POP.style.top = (r.bottom + window.scrollY + 6) + 'px';
    POP.style.left = Math.max(8, Math.min(r.right + window.scrollX - POP.offsetWidth, document.documentElement.clientWidth - POP.offsetWidth - 8)) + 'px';
  }
  function closePop(){ if (POP){ POP.remove(); POP = null; } }
  function handleAct(b){
    var a = b.getAttribute('data-act'), id = b.getAttribute('data-id'), mid = b.getAttribute('data-mid') || '';
    if (!CAN_EDIT){ closePop(); return; }
    if (a === 'color' || a === 'pick-date' || (a === 'plan' && S.plan.milestones.length)){
      var key = a + ':' + (id || mid);
      if (POP && POP.getAttribute('data-for') === key){ closePop(); return; }
      if (a === 'color') openColor(b, key); else if (a === 'pick-date') openCal(b, key); else openDest(b, key);
      return;
    }
    if (a === 'cal-nav'){
      if (!CAL || !POP) return;
      CAL.m += +b.getAttribute('data-step');
      if (CAL.m < 0){ CAL.m = 11; CAL.y--; } else if (CAL.m > 11){ CAL.m = 0; CAL.y++; }
      POP.innerHTML = calHtml();
      return;
    }
    closePop();
    if (a === 'setcolor'){ var c = b.getAttribute('data-color'); if (c) S.plan.tags[id] = c; else delete S.plan.tags[id]; touch(); }
    else if (a === 'plan') movePlan(id, '', null);
    else if (a === 'plan-to') movePlan(id, mid, null);
    else if (a === 'unplan') unplan(id);
    else if (a === 'done') toggleDone(id);
    else if (a === 'cal-day') setMs(mid, 'deadline', b.getAttribute('data-date'));
    else if (a === 'cal-clear') setMs(mid, 'deadline', '');
    else if (a === 'add-task') addTask(mid);
    else if (a === 'del-task') delTask(id);
    else if (a === 'add-ms') addMilestone();
    else if (a === 'del-ms') delMilestone(mid);
    else if (a === 'add-item') addItem(b.getAttribute('data-pk'), +b.getAttribute('data-si'));
    else if (a === 'del-item') delItem(b.getAttribute('data-pk'), +b.getAttribute('data-si'), +b.getAttribute('data-j'));
  }

  /* Drag and drop: cards move across the line into the 2-week plan, back below it, or up and down inside the plan. */
  function dropIndex(zone, y){
    var cards = (zone.querySelector('.plist') || zone).querySelectorAll('.pcard:not(.dragging)'), i = 0;
    for (; i < cards.length; i++){ var r = cards[i].getBoundingClientRect(); if (y < r.top + r.height / 2) break; }
    return i;
  }
  function clearDrop(){
    var z = root.querySelectorAll('[data-zone].over');
    for (var i = 0; i < z.length; i++) z[i].classList.remove('over');
    if (IND && IND.parentNode) IND.parentNode.removeChild(IND);
  }
  function markZone(zone, y){
    var z = root.querySelectorAll('[data-zone].over');
    for (var i = 0; i < z.length; i++) if (z[i] !== zone) z[i].classList.remove('over');
    zone.classList.add('over');
    if (zone.getAttribute('data-zone') !== 'plan'){ if (IND && IND.parentNode) IND.parentNode.removeChild(IND); return; }
    if (!IND){ IND = document.createElement('div'); IND.className = 'drop-ind'; }
    var list = zone.querySelector('.plist') || zone;
    var cards = list.querySelectorAll('.pcard:not(.dragging)'), at = dropIndex(zone, y);
    if (at < cards.length) list.insertBefore(IND, cards[at]); else list.appendChild(IND);
  }
  document.addEventListener('dragstart', function(e){
    var card = e.target.closest && e.target.closest('.pcard');
    if (!card) return;
    var fromGrip = e.target.classList && e.target.classList.contains('grip');
    if (!CAN_EDIT || SAVING || (EDITING && !fromGrip)){ e.preventDefault(); return; }
    closePop();
    DRAG = card.getAttribute('data-id');
    try { e.dataTransfer.setData('text/plain', DRAG); e.dataTransfer.effectAllowed = 'move'; if (fromGrip) e.dataTransfer.setDragImage(card, 16, 16); } catch(err){}
    setTimeout(function(){ card.classList.add('dragging'); }, 0);
    document.body.classList.add('is-dragging');
  });
  document.addEventListener('dragend', function(){
    DRAG = null; clearDrop(); document.body.classList.remove('is-dragging');
    var d = root.querySelectorAll('.pcard.dragging'); for (var i = 0; i < d.length; i++) d[i].classList.remove('dragging');
  });
  document.addEventListener('dragover', function(e){
    if (!DRAG) return;
    var zone = e.target.closest && e.target.closest('[data-zone]');
    if (!zone){ clearDrop(); return; }
    e.preventDefault();
    try { e.dataTransfer.dropEffect = 'move'; } catch(err){}
    markZone(zone, e.clientY);
  });
  document.addEventListener('drop', function(e){
    if (!DRAG) return;
    var zone = e.target.closest && e.target.closest('[data-zone]');
    var id = DRAG; DRAG = null;
    if (!zone){ clearDrop(); return; }
    e.preventDefault();
    var at = dropIndex(zone, e.clientY);
    clearDrop();
    document.body.classList.remove('is-dragging');
    if (zone.getAttribute('data-zone') === 'plan') movePlan(id, zone.getAttribute('data-mid') || '', at); else unplan(id);
  });

  /* ---------- editing ---------- */
  function editable(t){
    if (!EDITING || !t) return null;
    if (t.nodeType === 3) t = t.parentNode;
    return t && t.closest ? t.closest('[data-path]') : null;
  }
  function selHost(){ var s = window.getSelection(); return s && s.rangeCount ? editable(s.anchorNode) : null; }
  function onEdit(el){
    var path = el.getAttribute('data-path'), v = clean(el.innerHTML, isRich(path));
    setP(path, v);
    var twins = root.querySelectorAll('[data-path="' + path + '"]');
    for (var i = 0; i < twins.length; i++) if (twins[i] !== el) twins[i].innerHTML = v;
    if (!DIRTY){ DIRTY = true; bar('edit', 'You have unsaved changes.'); }
  }
  function updFmt(){
    var bb = document.getElementById('fmt-bold'), lb = document.getElementById('fmt-list'); if (!bb || !lb) return;
    var host = selHost(), on = false, lon = false;
    if (host){ try { on = document.queryCommandState('bold'); lon = document.queryCommandState('insertUnorderedList'); } catch(e){} }
    bb.disabled = !host;
    lb.disabled = !host || !isRich(host.getAttribute('data-path'));
    bb.setAttribute('aria-pressed', on ? 'true' : 'false');
    lb.setAttribute('aria-pressed', lon && !lb.disabled ? 'true' : 'false');
  }
  document.addEventListener('selectionchange', function(){ if (EDITING) updFmt(); });
  document.addEventListener('change', function(e){
    var t = e.target; if (!t || !t.classList || !CAN_EDIT) return;
    if (t.classList.contains('mtype')) setMs(t.getAttribute('data-mid'), 'type', t.value);
  });
  document.addEventListener('input', function(e){ var el = editable(e.target); if (el) onEdit(el); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && POP){ closePop(); return; }
    var el = editable(e.target); if (!el) return;
    var path = el.getAttribute('data-path'), mod = e.metaKey || e.ctrlKey, k = (e.key || '').toLowerCase();
    var im = /^programs\.(\w+)\.sections\.(\d+)\.p1items\.(\d+)\.text$/.exec(path);
    if (e.key === 'Enter' && im){ e.preventDefault(); onEdit(el); addItem(im[1], +im[2], +im[3]); return; }
    var tm = /^plan\.tasks\.(\w+)\.text$/.exec(path);
    if (e.key === 'Enter' && tm){ e.preventDefault(); onEdit(el); addTask(listOf(tm[1]), tm[1]); return; }
    if (e.key === 'Enter' && !isRich(path)){ e.preventDefault(); return; }
    if (mod && (k === 'i' || k === 'u')){ e.preventDefault(); return; }
    if (e.key === 'Escape'){ el.blur(); }
  });
  document.addEventListener('paste', function(e){
    var el = editable(e.target); if (!el) return;
    e.preventDefault();
    var rich = isRich(el.getAttribute('data-path'));
    var text = (e.clipboardData || window.clipboardData).getData('text/plain') || '';
    text = rich ? text.replace(/\r\n?/g, '\n') : text.replace(/\s+/g, ' ');
    var ok = false;
    try { ok = document.execCommand('insertText', false, text); } catch(err){}
    if (!ok){
      var sel = window.getSelection();
      if (sel && sel.rangeCount){ var r = sel.getRangeAt(0); r.deleteContents(); r.insertNode(document.createTextNode(text)); r.collapse(false); }
      onEdit(el);
    }
  });
  document.addEventListener('mousedown', function(e){ if (e.target.closest && e.target.closest('[data-fmt]')) e.preventDefault(); });
  document.addEventListener('click', function(e){
    if (EDITING && editable(e.target) && e.target.closest('a')){ e.preventDefault(); return; }
    var act = e.target.closest && e.target.closest('[data-act]');
    if (act){ if (!act.disabled) handleAct(act); return; }
    if (POP && !(e.target.closest && e.target.closest('.cpop'))) closePop();
    var pb = e.target.closest && e.target.closest('[data-prog]');
    if (pb){ switchProg(pb.getAttribute('data-prog'), !!pb.closest('.nav')); return; }
    var f = e.target.closest && e.target.closest('[data-fmt]');
    if (f){
      if (f.disabled) return;
      var host = selHost(); if (!host) return;
      if (f.getAttribute('data-fmt') === 'list'){
        if (!isRich(host.getAttribute('data-path'))) return;
        document.execCommand('insertUnorderedList');
      } else {
        document.execCommand('bold');
      }
      onEdit(host); updFmt();
      return;
    }
    var btn = e.target.closest && e.target.closest('[data-action]');
    if (!btn || btn.disabled) return;
    var a = btn.getAttribute('data-action');
    if (a === 'compact'){ COMPACT = !COMPACT; try { localStorage.setItem(COMPACT_KEY, COMPACT ? '1' : '0'); } catch(err){} applyCompact(); }
    else if (a === 'edit'){
      EDITING = true; DIRTY = DIRTY || false;
      try { document.execCommand('styleWithCSS', false, false); } catch(err){}
      applyCompact(); applyEditable(); applyEditBtn(); bar('edit', DIRTY ? 'You have unsaved changes.' : HINT);
    }
    else if (a === 'cancel'){ S = JSON.parse(ORIGINAL); ensurePlan(); EDITING = false; DIRTY = false; BAR = null; remount(); }
    else if (a === 'save'){ save(); }
    else if (a === 'restore'){ S = JSON.parse(PENDING); ensurePlan(); PENDING = null; clearDraft(); EDITING = true; DIRTY = true; BAR = { mode: 'edit', msg: 'Your edits are back. Check them, then save.' }; mount(); }
    else if (a === 'discard'){ PENDING = null; clearDraft(); bar(null); }
    else if (a === 'close'){ bar(null); }
  });
  function switchProg(k, fromNav){
    if (!S.programs[k] || k === PROG) return;
    var y = window.scrollY, keep = fromNav && VIEW === 'full' ? ACTIVE : null;
    PROG = k; try { localStorage.setItem(PROG_KEY, k); } catch(e){}
    mount();
    var t = keep && document.getElementById(keep);
    if (t) t.scrollIntoView({ behavior: 'instant' });
    else window.scrollTo({ top: Math.min(y, document.documentElement.scrollHeight), behavior: 'instant' });
  }
  function clearDraft(){ try { sessionStorage.removeItem(DRAFT_KEY); } catch(e){} }

  function normalize(o){
    if (typeof o === 'string') return o.replace(/ /g, ' ').replace(/\s+/g, ' ').trim();
    if (Array.isArray(o)) return o.map(normalize);
    if (o && typeof o === 'object'){ var r = {}; for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) r[k] = normalize(o[k]); return r; }
    return o;
  }
  function buildDoc(json){
    var reset = FALLBACK_RESET, hs = document.head ? document.head.querySelectorAll('style') : [];
    for (var i = 0; i < hs.length; i++){ if (/safe-area-inset/.test(hs[i].textContent)){ reset = hs[i].textContent; break; } }
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
      PRELUDE +
      '<style id="page-style">' + document.getElementById('page-style').textContent + '</style>\n' +
      '<div id="root"></div>\n' +
      '<script type="application/json" id="state">' + json.replace(/</g, '\\u003c') + '<\/script>\n' +
      '<script id="app">' + document.getElementById('app').textContent + '<\/script>\n' +
      '</body></html>';
  }
  function save(){
    if (SAVING || !ART) return;
    pruneItems();
    S = normalize(S);
    var json = JSON.stringify(S);
    if (json === JSON.stringify(JSON.parse(ORIGINAL))){ EDITING = false; DIRTY = false; BAR = { mode: 'info', msg: 'Nothing changed, so there was nothing to save.' }; mount(); return; }
    SAVING = true; bar('edit', 'Saving…');
    try { sessionStorage.setItem(DRAFT_KEY, json); } catch(e){}
    ART.publish(buildDoc(json)).then(function(){
      if (STANDALONE){
        ORIGINAL = json; SAVING = false; EDITING = false; DIRTY = false; clearDraft();
        BAR = { mode: 'info', msg: 'Saved to GitHub. It will be live for everyone in about a minute.' };
        mount(); return;
      }
      bar('edit', 'Saved. Loading the new version…');
    }, function(err){
      SAVING = false;
      var code = err && err.code;
      if (code === 'conflict'){ bar('info', 'Someone published a newer version first. The page is reloading to it, and you can restore your edits once it loads.'); return; }
      clearDraft();
      if (['not_writer','not_granted','consent_required','capability_disabled','capability_removed','not_declared'].indexOf(code) > -1){
        CAN_EDIT = false; EDITING = false; applyEditable(); applyEditBtn(); applyCompact();
        bar('info', 'You can view this page but not edit it. Ask the owner for edit access.');
        return;
      }
      if (code === 'not_configured'){ bar('edit', 'The server is not set up for saving yet (missing environment variables).'); return; }
      if (code === 'github_read' || code === 'github_write'){ bar('edit', 'GitHub rejected the save. Check the token and its permissions.'); return; }
      if (code === 'rate_limited'){ bar('edit', 'Too many saves in a short time. Wait a minute, then save again.'); return; }
      if (code === 'too_large'){ bar('edit', 'The page is too large to save. Shorten some text, then save again.'); return; }
      if (code === 'invalid_content' || code === 'transform_error'){ bar('edit', 'This version could not be saved. Undo your last change, then save again.'); return; }
      bar('edit', 'Couldn’t save. Check your connection, then save again.');
    });
  }

  /* ---------- boot ---------- */
  mount();
  if (STANDALONE){
    /* Hosted outside Claude: Save posts to /api/save, which commits index.html to GitHub. */
    ART = { publish: function(html){
      return fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ html: html }) })
        .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){
          if (!r.ok){ var er = new Error(j.error || 'save failed'); er.code = j.code || 'error'; throw er; }
          return j;
        }); });
    } };
    CAN_EDIT = true; applyEditBtn();
  } else {
  if (window.claude && typeof window.claude.use === 'function'){
    Promise.resolve(window.claude.use('artifact')).then(function(a){
      if (!a){ PENDING = null; return; }
      ART = a;
      return Promise.resolve(window.claude.use('user')).then(function(u){ return u ? u.canEdit() : null; }, function(){ return null; }).then(function(can){
        if (can === false){ PENDING = null; return; }
        CAN_EDIT = true; applyEditBtn();
        if (PENDING) bar('restore', 'Your last edits weren’t saved because a newer version was published first.');
      });
    }).catch(function(){});
  }
  }
})();
</script>
</body></html>
